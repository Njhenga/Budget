<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Budget</title>
    <link rel="stylesheet" href="./style.css"/>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
</head>

<body>
    
    <h1> <img src="./svgs/currency-dollar.svg" alt="dollar sign" height="80px">Wanna track your expenses and drop being a spendthrift</h1>

    <p>Detailed transaction-like indicated to keep you on  the loop <img src="./svgs/graph-up.svg" alt="graph" height="80px"></p>
    <div class="container">
        <label for="date">Date</label>
       <input type="date" class="date" required>
       <label for="groceries">Expense</label>
        <input type="text" placeholder="List your expenses..." class="exp" required>
        <label for="total amount">Total Amount</label>
        <input type="number" placeholder="amount...." class="money" required>

         <button class="save">save</button>
         </div>


         <h2>check your list of Expenses </h2>

         <ul class="addList"></ul>
         
           


         <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
         
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <script charset="UTF-8" src="./index.js"></script>
</body>
</html>
